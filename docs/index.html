<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>精品媒体中心</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<main>
  <header>
    <p class="eyebrow">CURATED MEDIA · 官方资源</p>
    <h1>精品媒体中心</h1>
    <p>精选直播、广播与英语课程。直播订阅只收录得到第三方播放许可并通过检测的频道；课程与视频使用官方入口。</p>
  </header>
  <nav class="tabs" aria-label="媒体中心">
    <button id="tab-A" data-profile="A" aria-pressed="true">A · 综合精品电视</button>
    <button id="tab-B" data-profile="B" aria-pressed="false">B · 英语学习</button>
  </nav>
  <section class="controls" aria-label="筛选">
    <label>搜索节目 <input id="search" type="search" placeholder="节目、媒体或主题"></label>
    <label>接入类型 <select id="type"><option value="all">全部类型</option><option value="live_video">电视直播</option><option value="live_audio">广播直播</option><option value="vod">官方点播</option><option value="podcast">Podcast</option><option value="official_link">官网与课程</option></select></label>
    <label>媒体来源 <select id="source"><option value="all">全部来源</option></select></label>
    <label>内容分类 <select id="category"><option value="all">全部分类</option></select></label>
    <label class="learning-filter">英语难度 <select id="level"><option value="all">全部难度</option></select></label>
    <label class="learning-filter">学习类型 <select id="learning-type"><option value="all">全部学习类型</option></select></label>
  </section>
  <p id="count" class="count" aria-live="polite"></p>
  <section id="cards" class="cards" aria-label="媒体内容"></section>
  <p id="empty" class="empty" hidden>没有符合条件的内容。</p>
  <footer><p>NZ_UNVERIFIED 表示尚未从已确认位于新西兰的网络实测。网页可达不代表媒体可以播放；播放检测不代表版权授权。</p><p><a href="https://github.com/suki827/tvbox-config">项目源码与验证报告</a></p></footer>
</main>
<script src="app.js" defer></script>
</body>
</html>
