<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>精品媒体目录</title><link rel="stylesheet" href="app.css"></head>
<body><main><header><p class="eyebrow">CURATED MEDIA · 官方入口目录</p><h1>精品媒体中心</h1><p>精选电视与英语学习资源。直播仅在授权与播放均验证后提供订阅；其余内容请从官方入口观看。</p></header>
<nav class="tabs" aria-label="媒体中心"><button id="tab-A" data-profile="A" aria-pressed="true">A · 综合精品电视</button><button id="tab-B" data-profile="B" aria-pressed="false">B · 英语学习</button></nav>
<section class="controls" aria-label="筛选"><label>搜索 <input id="search" type="search" placeholder="搜索媒体、节目或分类"></label><label>类型 <select id="type"><option value="all">全部</option><option value="live_video">电视直播</option><option value="live_audio">广播直播</option><option value="vod">官方点播</option><option value="podcast">Podcast</option><option value="official_link">官方入口</option></select></label><label>分类 <select id="category"><option value="all">全部分类</option></select></label></section>
<p id="count" class="count" aria-live="polite"></p><section id="cards" class="cards" aria-label="媒体内容"></section><p id="empty" class="empty" hidden>没有符合条件的内容。</p>
<footer><p>地区显示为来源说明，未在新西兰实测的内容标为 NZ_UNVERIFIED。官网入口不代表播放器直播授权。</p><p><a href="https://github.com/suki827/tvbox-config">查看项目与检测报告</a></p></footer></main><script src="app.js" defer></script></body></html>
