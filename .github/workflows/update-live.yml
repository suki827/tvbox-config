name: Update TVBox live config (frozen)
# The 4071-channel base playlists are protected during the English HD refactor.
# This legacy workflow is retained for an intentional manual run only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate TVBox compatible live list
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/update_live.py
      - name: Commit live playlists
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main advanced; rerun this manual workflow to avoid overwriting changes." >&2
            exit 1
          fi
          git add -- live_config.txt live_config_base.m3u live_config.m3u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update TVBox live config"
          git push origin HEAD:main
