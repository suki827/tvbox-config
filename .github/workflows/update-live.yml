name: Update TVBox live config

on:
  workflow_dispatch:
  schedule:
    - cron: "20 16 * * *"
  push:
    paths:
      - "scripts/update_live.py"
      - ".github/workflows/update-live.yml"

permissions:
  contents: write

concurrency:
  group: live-playlist-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate TVBox compatible live list
        id: generate
        run: |
          python -m unittest discover -s tests -v
          python scripts/update_live.py
      - name: Commit live playlists
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              git reset --hard origin/main
              python scripts/update_live.py
            fi
            git add -A -- live_config.txt live_config_base.m3u live_config.m3u
            if git diff --cached --quiet; then
              echo "No playlist changes."
              exit 0
            fi
            git commit -m "chore: update TVBox live config"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; retrying from origin/main."
          done
          exit 1
