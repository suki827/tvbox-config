name: Refresh English HD IPTV
on:
  workflow_dispatch:
  schedule:
    - cron: "23 17 * * *"
  push:
    paths:
      - ".github/workflows/english-hd.yml"
      - "scripts/build_english_hd.py"
      - "scripts/check_local_playback.py"
      - "scripts/commit_english_hd.py"
      - "scripts/playlist.py"
      - "data/iptv_candidates.json"
      - "data/iptv_selected.json"
      - "english_hd_candidates.json"
      - "tests/**"

permissions:
  contents: write

concurrency:
  group: english-hd-iptv
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Probe reviewed IPTV candidates
        run: python3 scripts/build_english_hd.py --region GITHUB_UNVERIFIED
      - name: Verify protected base playlists
        run: git diff --exit-code -- live_config.m3u live_config_base.m3u
      - name: Upload English HD verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-hd-verification
          path: |
            english_hd_verification.csv
            english_hd_candidates.json
          if-no-files-found: warn
      - name: Commit results
        run: python3 scripts/commit_english_hd.py
