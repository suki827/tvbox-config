name: Refresh English HD
on:
  workflow_dispatch:
  schedule:
    - cron: "23 17 * * *"
permissions:
  contents: write
concurrency:
  group: english-hd-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build playlists
        env:
          ENGLISH_HD_APPROVED_HOSTS: ${{ vars.ENGLISH_HD_APPROVED_HOSTS }}
          ENGLISH_HD_MAX_CHECKS: "150"
        run: python3 scripts/build_english_hd.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_config.m3u english_hd.m3u english_hd_verification.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh English HD playlist"
            git push
          fi
