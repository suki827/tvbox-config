name: Refresh English HD
on:
  workflow_dispatch:
  schedule:
    - cron: "23 17 * * *"
  push:
    paths:
      - ".github/workflows/english-hd.yml"
      - "scripts/build_english_hd.py"
      - "scripts/playlist.py"
      - "scripts/build_media.py"
      - "data/**"
      - "docs/**"
      - "tests/**"

permissions:
  contents: write

concurrency:
  group: live-playlist-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Build playlists
        id: build
        env:
          ENGLISH_HD_APPROVED_HOSTS: ${{ vars.ENGLISH_HD_APPROVED_HOSTS }}
          ENGLISH_HD_MAX_CHECKS: "72"
          ENGLISH_HD_WORKERS: "6"
        run: python3 scripts/build_english_hd.py
      - name: Check curated media and build catalogs
        id: media
        env:
          MEDIA_TEST_REGION: NZ_UNVERIFIED
        run: |
          python3 scripts/build_media.py --check
          echo "validated=true" >> "$GITHUB_OUTPUT"
      - name: Upload media verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curated-media-verification
          path: |
            data/media_verification.json
            media_check_report.csv
          if-no-files-found: warn
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-hd-verification
          path: english_hd_verification.csv
          if-no-files-found: warn
      - name: Commit verified results
        if: steps.build.outputs.validated == 'true' || steps.media.outputs.validated == 'true'
        env:
          ENGLISH_HD_APPROVED_HOSTS: ${{ vars.ENGLISH_HD_APPROVED_HOSTS }}
          ENGLISH_HD_MAX_CHECKS: "72"
          ENGLISH_HD_WORKERS: "6"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "Remote main changed; rebuilding from its latest commit (attempt $attempt)."
              git reset --hard origin/main
              : > "$GITHUB_OUTPUT"
              python3 scripts/build_english_hd.py
              python3 scripts/build_media.py --check
            fi
            git add -A -- live_config.m3u english_hd.m3u english_hd_verification.csv \
              premium_tv.m3u premium_radio.m3u premium_catalog.json \
              english_learning.m3u english_learning_catalog.json \
              data/channel_health.json data/media_verification.json \
              media_check_report.csv docs/catalog.json
            if git diff --cached --quiet; then
              echo "No verified file changes."
              exit 0
            fi
            git commit -m "chore: refresh verified media catalogs"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; retrying from origin/main."
          done
          echo "Could not push after three attempts" >&2
          exit 1
